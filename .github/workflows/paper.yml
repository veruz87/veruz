name: paper-live
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r signal-cron/requirements.txt
      - run: python signal-cron/live_paper.py --once
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@local"
          git add signal-cron/paper_live_state.json signal-cron/live_data.json
          git diff --cached --quiet || git commit -m "paper update $(date -u +%FT%TZ)"
          git push
