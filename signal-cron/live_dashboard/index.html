<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL ROOM</title>
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
<div id="room">
  <header>
    <div class="brand">SIGNAL ROOM<small>DSS-CROSS LONG ENGINE · LIVE</small></div>
    <div id="clock">--:--:--</div>
    <div id="fund" class="sub">FUND BTC —</div>
    <div id="feeddot">● FEED</div>
  </header>
  <aside id="leftRail">
  <div class="panel" id="pTop"><h3>TOP MOVERS <b>/ DSS</b></h3><div id="railTop"></div></div>
  <div class="panel" id="pHeat"><h3>HEATMAP <b>/ 21 PAIRS</b></h3><div id="heatGrid"></div></div>
  <div class="panel" id="pWire"><h3>THE WIRE <b>/ LIVE TRADES</b></h3><canvas id="wireCanvas"></canvas><div id="wire"><div id="wireInner"></div></div></div>
  </aside>
  <section id="center">
    <div class="panel" id="eqWrap">
      <div id="eqRow">
        <div class="eitem"><div class="k">EQUITY</div><div class="v big" id="eqNum">$0.00</div></div>
        <div id="eqStats">—</div>
      </div>
    </div>
    <div id="topRow">
      <div class="panel" id="vidWrap">
        <canvas id="globeMain"></canvas>
        <div id="vidTag">LIVE FEED</div>
      </div>
    </div>
    <div id="midRow">
      <div class="panel" id="plexWrap">
        <h3>PLEXUS <b>/ VOLUME</b></h3>
        <canvas id="field"></canvas>
      </div>
      <div class="panel" id="volWrap">
        <h3>GLOBE <b>/ 3D PAIRS</b></h3>
        <div id="globe3d"></div>
      </div>
    </div>
  </section>
  <aside id="rightRail">
    <div class="panel" id="pChart">
      <h3>BTC <b>/ LIVE 1M</b></h3>
      <div class="chartBox"><canvas id="btcCanvas"></canvas></div>
    </div>
    <div class="panel" id="pScan">
      <h3>TAPE <b>/ LIVE TRADES</b></h3>
      <canvas id="warpCanvas"></canvas>
      <div id="stream"><div id="streamInner"></div></div>
    </div>
    <div class="panel" id="pPos">
      <h3>POSITIONS <b>/ LIVE</b></h3>
      <div style="overflow-y:auto"><table id="posTable2">
        <tr><th>Sym</th><th>TF</th><th>PnL $</th></tr>
      </table></div>
    </div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js?v=22"></script>
<script src="live.js?v=24"></script>
<script src="three-globe.js?v=20"></script>
</body>
</html>
